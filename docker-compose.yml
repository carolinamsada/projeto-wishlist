version: "3.9"

services:
  api:
    # Usa a imagem publicada no Docker Hub (substituir pelo seu usuário)
    image: cmsada/glam-wishlist:latest
    ports:
      - "8000:8000"          # Mapeia porta local 8000 → porta do container
    environment:
      - DATABASE_URL=sqlite:///./wishlist.db
    volumes:
      - wishlist_data:/app   # Persiste o banco SQLite entre reinicializações

volumes:
  wishlist_data:
